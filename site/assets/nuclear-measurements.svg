<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 312" role="img" aria-labelledby="measurement-title measurement-description">
<title id="measurement-title">How nuclear size, boundary shape, and image texture become measurements</title>
<desc id="measurement-description">Conceptual drawings of nuclei, not specimen images and not to scale. Radius runs from center toward the outline, area is enclosed by it, and perimeter follows it. A second contour illustrates an inward dent. A grayscale pattern illustrates brightness variation. None of the drawings has a diagnosis.</desc>
<rect width="840" height="312" fill="#ffffff"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#253c47;text-anchor:middle}.kicker{font-size:12px;font-weight:650;letter-spacing:1px;fill:#286b70}.label{font-size:12px}.caption{font-size:15px;font-weight:600}.muted{font-size:12px;fill:#59636f}</style>
